controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "odom"

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      # --- Rotation Shim params ---
      # Nếu góc lệch với path > ngưỡng này thì xoay tại chỗ trước
      angular_dist_threshold: 0.785        # ~45 độ
      forward_sampling_distance: 0.5       # khoảng cách sample phía trước để check path
      rotate_to_heading_angular_vel: 1.0   # vận tốc xoay (≤ max_angular_vel robot)
      max_angular_accel: 2.0               # gia tốc góc tối đa
      simulate_ahead_time: 1.0             # thời gian simulate trước khi bàn giao cho primary
      rotate_to_goal_heading: false        # không xoay về goal yaw cuối (để primary lo)

      # --- Primary controller bên trong: MPPI ---
      primary_controller: "nav2_mppi_controller::MPPIController"
      iteration_count: 1
      batch_size: 2000
      time_steps: 56
      model_dt: 0.05
      vx_max: 0.5
      vx_min: -0.35
      vy_max: 0.0          # diff drive: vy = 0
      wz_max: 1.0
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ObstaclesCritic.cost_weight: 1.0
      GoalCritic.cost_weight: 5.0
      GoalAngleCritic.cost_weight: 3.0
      PathAlignCritic.cost_weight: 14.0
      PathFollowCritic.cost_weight: 4.0
      PathAngleCritic.cost_weight: 2.0
      PreferForwardCritic.cost_weight: 0.5
