controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "odom"

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_graceful_controller::GracefulController"

      # Transform tolerance
      transform_tolerance: 0.1

      # Khoảng cách tới motion target trên path
      # Tăng nếu robot bị "giật", giảm nếu bám đường kém
      motion_target_dist: 0.6

      # Tìm pose robot trên path trong bán kính này
      max_robot_pose_search_dist: 10.0

      # Gains điều khiển — điều chỉnh khi robot dao động
      k_phi: 3.0       # gain về hướng (phi)
      k_delta: 2.0     # gain về góc lái (delta)
      beta: 0.4        # giảm tốc khi tiếp cận
      lambda: 2.0      # độ cong quỹ đạo

      # Vận tốc
      v_linear_min: 0.1
      v_linear_max: 0.5          # khớp với max linear vel robot
      v_angular_max: 1.0         # khớp với max angular vel robot

      # Vùng giảm tốc khi gần đích
      slowdown_radius: 1.5

      # Xoay về hướng path trước khi đi
      initial_rotation: true
      initial_rotation_min_angle: 0.75   # ~43 độ, nhỏ hơn không xoay
      final_rotation: true               # xoay về goal yaw ở cuối

      # Frame
      robot_base_frame: "base_link"

      # Cho phép đi lùi khi cần
      allow_backward: false
